<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Bureau Platine : comme Mac OS 9, les polices système (Charcoal, Geneva, Chicago,
     Monaco) s'affichent nettes, sans lissage, avec les instructions TrueType d'Apple. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Charcoal</string></test>
    <test name="pixelsize" compare="less"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Geneva</string></test>
    <test name="pixelsize" compare="less"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Chicago</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Monaco</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
	<!-- Gras et italique synthétiques pour les polices de Mac OS 9 livrées en un seul style
	     (Geneva, Charcoal…), comme QuickDraw les fabriquait -->
	<match target="font">
		<test name="weight" compare="less_eq"><const>medium</const></test>
		<test target="pattern" name="weight" compare="more_eq"><const>bold</const></test>
		<edit name="embolden" mode="assign"><bool>true</bool></edit>
		<edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
		<edit name="weight" mode="assign"><const>bold</const></edit>
	</match>
	<match target="font">
		<test name="slant" compare="eq"><const>roman</const></test>
		<test target="pattern" name="slant" compare="not_eq"><const>roman</const></test>
		<edit name="matrix" mode="assign">
			<times><name>matrix</name><matrix><double>1</double><double>0.2</double><double>0</double><double>1</double></matrix></times>
		</edit>
		<edit name="slant" mode="assign"><const>oblique</const></edit>
		<edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
	</match>
</fontconfig>
